name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: ""
          - os: macos-14
            rustflags: ""
          - os: windows-latest
            rustflags: "-C link-arg=/NODEFAULTLIB:libcpmt.lib -C link-arg=/NODEFAULTLIB:libcmt.lib"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: make ci-test
        run: make ci-test

      - name: make ci-lint
        run: make ci-lint

      - name: cargo build --all-features
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --all-features

  # Default builds never compile the optional embedding subsystem, so
  # feature-gated code gets zero coverage in the test job. Keep a dedicated
  # compile check (check-only, not test: embedding tests may hit local
  # providers or model downloads) so gated code cannot rot uncompiled.
  feature-check:
    name: Check (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: all-features

      - name: cargo check --workspace --all-features
        run: cargo check --workspace --all-features
