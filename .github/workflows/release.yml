name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Rehearsal entry point: dispatching from a branch builds every release
  # artifact without publishing anything. Publish jobs below are guarded by
  # the tag-ref check for exactly this reason.
  workflow_dispatch:

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # On workflow_dispatch there is no tag to verify; the real gate runs on
      # the tag push that actually releases.
      - name: Check tag == Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ "v${CARGO_VER}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version v${CARGO_VER}"
            echo "Bump [package].version in Cargo.toml to match the release tag."
            exit 1
          fi
          echo "OK: ${TAG} matches Cargo.toml v${CARGO_VER}"

  # Native builds instead of `cross`: the prebuilt ONNX Runtime static lib
  # (ort-sys rc.13, ONNX Runtime 1.28.0) references `__libc_single_threaded`
  # (glibc 2.32+) and GCC 11 libstdc++ symbols that the cross 0.2.5 Ubuntu
  # 20.04 sysroot cannot resolve. Native runners link against modern glibc and
  # ship the full feature set including `semantic-triage`. The resulting
  # binaries require glibc >= 2.39 at runtime; see docs/EMBEDDINGS.md.
  build-linux:
    name: Linux ${{ matrix.deb_arch }}
    needs: [check-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-all-features

      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo install cargo-deb --version "=3.7.0" --locked

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Stage binary and deb
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/synrepo" "dist/synrepo-${VER}-linux-${DEB_ARCH}"
          if [ "${TARGET}" = "x86_64-unknown-linux-gnu" ]; then
            cargo deb --no-build --target "${TARGET}" \
              --output "dist/synrepo_${VER}_${DEB_ARCH}.deb"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.deb_arch }}
          path: dist/

  # ort-sys ships no prebuilt ONNX Runtime for x86_64-apple-darwin (dropped
  # upstream in rc.11), so the Intel build compiles ONNX Runtime from source
  # and links it via ORT_LIB_PATH. The version must match the ONNX Runtime
  # release paired with the pinned ort crate (rc.13 -> 1.28.0, see the dist
  # table inside ort-sys's build/download/dist.tsv). Apple silicon and Windows
  # use the upstream prebuilt binaries directly.
  build-macos:
    name: macOS ${{ matrix.suffix }}
    needs: [check-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            suffix: macos-arm64
            build-ort: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: macos-x86_64
            build-ort: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-all-features

      - name: Check out ONNX Runtime v1.28.0
        if: matrix.build-ort
        uses: actions/checkout@v7
        with:
          repository: microsoft/onnxruntime
          ref: v1.28.0
          path: ort-src
          persist-credentials: false

      - name: Cache ONNX Runtime build
        if: matrix.build-ort
        uses: actions/cache@v4
        with:
          path: ort-src/build
          key: onnxruntime-v1.28.0-x86_64-release

      - name: Build ONNX Runtime
        if: matrix.build-ort
        run: |
          # Component builds never produce a merged libonnxruntime.a here;
          # the session archive is the marker for a completed build tree.
          if [ -f ort-src/build/MacOS/Release/libonnxruntime_session.a ]; then
            echo "Using cached ONNX Runtime build"
            exit 0
          fi
          # Best-effort: the image usually already has these, and a PEP 668
          # refusal should not fail the job if so. build.sh reports any truly
          # missing module itself.
          python3 -m pip install --quiet --user packaging wheel || true
          cd ort-src
          # CMAKE_IGNORE_PREFIX_PATH keeps Homebrew-installed abseil (brew
          # prefix is /opt/homebrew on arm, /usr/local on Intel) from
          # colliding with the abseil ONNX Runtime fetches for itself.
          # BUILD_UNIT_TESTS=OFF is required alongside --skip_tests:
          # --skip_tests only skips running them, and the test targets do not
          # compile warning-clean on newer toolchains.
          ./build.sh --config Release --parallel --skip_tests \
            --disable_contrib_ops --disable_ml_ops \
            --cmake_extra_defines "CMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local" \
            onnxruntime_BUILD_UNIT_TESTS=OFF
          # ORT's cmake only adds re2 include paths to the providers target
          # without linking it (its unit-test cmake is what normally pulls the
          # re2 target in, and we build with tests off). Some provider kernels
          # reference re2 symbols, so build it explicitly.
          cmake --build ort-src/build/MacOS/Release --config Release --target re2

      - name: Merge ONNX Runtime into a single static archive
        if: matrix.build-ort
        run: |
          # ort-sys either links one merged libonnxruntime.a (what pyke's
          # prebuilts ship) or ORT's per-component archives. The component
          # path misses ORT's model_package helpers, so mirror pyke and merge
          # every non-test archive into one self-contained file. Member order
          # does not matter; unused members are never pulled in.
          mkdir -p ort-dist
          find ort-src/build/MacOS/Release -name '*.a' \
            ! -path '*googletest*' ! -name '*test*' ! -name '*gtest*' \
            ! -name '*gmock*' ! -name '*unittest*' -print0 \
            | xargs -0 libtool -static -o ort-dist/libonnxruntime.a
          # Fail fast if a dependency group ever goes missing from the merge
          # again (this bit us: re2 was absent because ORT never builds it
          # without its unit-test targets).
          for sym in '_ZN3re2' '_ModelVariantInfo_FindExecutorInfo' '_ZN6google8protobuf'; do
            if ! nm -g ort-dist/libonnxruntime.a 2>/dev/null | grep -q "$sym"; then
              echo "FATAL: $sym missing from merged libonnxruntime.a"
              exit 1
            fi
          done
          ls -lh ort-dist/libonnxruntime.a

      - name: Build binary
        env:
          ORT_LIB_PATH: ${{ github.workspace }}/ort-dist
          # ort-sys's #[link(kind="static")] pulls the merged archive into
          # libort_sys.rlib, and ld's fixpoint scanning through that nested
          # archive is unreliable (re2 members went unresolved on Intel).
          # Putting the archive directly on the link line makes the final
          # link deterministic; ORT_LIB_PATH stays set for ort-sys's
          # prerequisite setup (-lc++, CoreML, clang_rt).
          RUSTFLAGS: -C link-arg=${{ github.workspace }}/ort-dist/libonnxruntime.a
        if: matrix.build-ort
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Build binary (prebuilt ONNX Runtime)
        if: ${{ !matrix.build-ort }}
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Stage binary
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/synrepo" "dist/synrepo-${VER}-${SUFFIX}"
          # zip for Homebrew cask; archive must contain a file named "synrepo" so brew links it correctly
          cp "target/${TARGET}/release/synrepo" dist/synrepo
          cd dist && zip "synrepo-${VER}-${SUFFIX}.zip" synrepo && rm synrepo

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/

  build-windows:
    name: Windows amd64
    needs: [check-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build binary
        env:
          RUSTFLAGS: -C link-arg=/NODEFAULTLIB:libcmt.lib
        run: cargo build --release --target x86_64-pc-windows-msvc --all-features

      - name: Stage binary
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/synrepo.exe" "dist/synrepo-${VER}-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crate:
    name: Publish to crates.io
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          cargo publish 2>&1 | tee /tmp/cargo-publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          if grep -F "already exists on crates.io index" /tmp/cargo-publish.log >/dev/null; then
            exit 0
          fi
          exit "${status}"

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        id: ver
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 from published release assets
        id: sha
        env:
          VER: ${{ steps.ver.outputs.VER }}
        run: |
          BASE="https://github.com/whit3rabbit/synrepo/releases/download/v${VER}"
          curl -fsSL "${BASE}/synrepo-${VER}-macos-arm64.zip" -o arm64.zip
          curl -fsSL "${BASE}/synrepo-${VER}-macos-x86_64.zip" -o x86_64.zip
          ARM_SHA=$(sha256sum arm64.zip | awk '{print $1}')
          X86_SHA=$(sha256sum x86_64.zip | awk '{print $1}')
          echo "arm=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "x86=${X86_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.tap.outputs.available == 'true'
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate cask
        if: steps.tap.outputs.available == 'true'
        env:
          VER: ${{ steps.ver.outputs.VER }}
          ARM: ${{ steps.sha.outputs.arm }}
          X86: ${{ steps.sha.outputs.x86 }}
        run: |
          chmod +x scripts/render_homebrew_cask.sh
          scripts/render_homebrew_cask.sh \
            packaging/homebrew/Casks/synrepo.rb \
            homebrew-tap/Casks/synrepo.rb \
            "${VER}" \
            "${ARM}" \
            "${X86}"
          ruby -c homebrew-tap/Casks/synrepo.rb

      - name: Commit and push cask
        if: steps.tap.outputs.available == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/synrepo.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update synrepo cask to ${{ steps.ver.outputs.VER }}"
          git push origin main

  update-changelog:
    name: Update CHANGELOG.md
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Append release notes for ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Idempotent: a curated or previously generated section wins.
          if grep -qE "^## \[${VER}\]" CHANGELOG.md; then
            echo "CHANGELOG already documents ${VER}; nothing to do."
            exit 0
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          DATE=$(git log -1 --format=%cd --date=short "${TAG}")
          NOTES=$(git log --no-merges --format='- %s' "${RANGE}" \
            | grep -viE '^- (Release|Update CHANGELOG)' || true)
          [ -n "${NOTES}" ] || NOTES="- See Git history for details."
          {
            echo "## [${VER}] - ${DATE}"
            echo ""
            echo "### Changed"
            echo "${NOTES}"
          } > .changelog-entry
          awk 'NR==FNR { entry = entry $0 ORS; next }
               { print }
               /^## \[Unreleased\]/ && !ins { printf "\n%s", entry; ins = 1 }
               END { if (!ins) printf "\n%s", entry }
              ' .changelog-entry CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          rm -f .changelog-entry

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update CHANGELOG for ${TAG}"
          git push origin HEAD:main
